project:
  type: book
  post-render:
    - bash ./scripts/build-glossary.sh

resources:
  - glossary.json
  - scripts/*.js
  # Printable guided notes and their keys.  The keys are copied into the site
  # but nothing links to them: they are reachable only by typing the URL.
  # Built by scripts/build-guided-notes.py.
  - guided_notes/Unit_*/*.html
  - guided_notes/assets/*
  # Quizzes and their keys, and the teacher bookmark that lists every
  # printable with its key.  Unlisted: nothing in the book links to them.
  - assessments/Unit_*/*.html
  - assessments/index.html
  # Figures.  Quarto copies an image it finds in a rendered .qmd; a figure
  # that only a handout shows (a blank grid, a _KEY twin) is invisible to it,
  # so all of them are listed here.
  - images/Unit_*/*.svg

extensions:
  - glossary
  - headings

format:
  html:
    theme:
      - flatly
    css:
      - styles/custom-callouts.css
      - styles/custom-general.css
      - styles/glossary-tooltips.css
    include-after-body:
      - scripts/inject-custom.html
    include-in-header: mathjax-macros.html
    html-math-method: mathjax

book:
  title: "DHS Geometry"
  author: "Andy Ross"
  favicon: images/logo.png
  image: images/logo.png
  search: true

  navbar:
    search: true

  sidebar:
    search: true
    logo: images/logo.png
    collapse-level: 1

  chapters:
    - file: index.md

    - part: "Unit 1: Lines, Angles, and Equations"
      chapters:
        - file: chapters/Unit_1/index.qmd
        - file: chapters/Unit_1/1.1_Points_Lines_Segments_and_Angles.qmd
        - file: chapters/Unit_1/1.2_Segment_and_Angle_Addition.qmd
        - file: chapters/Unit_1/1.3_Complementary_Supplementary_and_Vertical_Angles.qmd
        - file: chapters/Unit_1/1.4_Parallel_Lines_and_Transversals.qmd
        - file: chapters/Unit_1/1.5_Angles_in_Triangles_and_Polygons.qmd
        - file: chapters/Unit_1/Summary.qmd
        - file: chapters/Unit_1/Review.qmd

    - part: "Unit 2: The Pythagorean Theorem and the Coordinate Plane"
      chapters:
        - file: chapters/Unit_2/index.qmd
        - file: chapters/Unit_2/2.1_Square_Roots_and_Simplifying_Radicals.qmd
        - file: chapters/Unit_2/2.2_The_Pythagorean_Theorem_and_Its_Converse.qmd
        - file: chapters/Unit_2/2.3_The_Pythagorean_Theorem_in_the_Real_World.qmd
        - file: chapters/Unit_2/2.4_Distance_on_the_Coordinate_Plane.qmd
        - file: chapters/Unit_2/2.5_Midpoint.qmd
        - file: chapters/Unit_2/2.6_Slope_Parallel_Lines_and_Perpendicular_Lines.qmd
        - file: chapters/Unit_2/2.7_Dividing_a_Segment_in_a_Ratio.qmd
        - file: chapters/Unit_2/2.8_Perimeter_and_Area_on_the_Coordinate_Plane.qmd
        - file: chapters/Unit_2/2.9_Checking_Shapes_with_Coordinates.qmd
        - file: chapters/Unit_2/Summary.qmd
        - file: chapters/Unit_2/Review.qmd

    - part: "Unit 3: Transformations"
      chapters:
        - file: chapters/Unit_3/index.qmd
        - file: chapters/Unit_3/3.1_Translations.qmd
        - file: chapters/Unit_3/3.2_Reflections.qmd
        - file: chapters/Unit_3/3.3_Rotations.qmd
        - file: chapters/Unit_3/3.4_Dilations.qmd
        - file: chapters/Unit_3/3.5_Sequences_of_Transformations_and_Symmetry.qmd
        - file: chapters/Unit_3/Summary.qmd
        - file: chapters/Unit_3/Review.qmd

    - part: "Unit 4: Congruence"
      chapters:
        - file: chapters/Unit_4/index.qmd
        - file: chapters/Unit_4/4.1_Congruent_Figures_and_Rigid_Motions.qmd
        - file: chapters/Unit_4/4.2_Triangle_Congruence.qmd
        - file: chapters/Unit_4/4.3_Isosceles_and_Equilateral_Triangles.qmd
        - file: chapters/Unit_4/4.4_Quadrilaterals_and_Their_Properties.qmd
        - file: chapters/Unit_4/4.5_Constructions.qmd
        - file: chapters/Unit_4/Summary.qmd
        - file: chapters/Unit_4/Review.qmd

    - part: "Unit 5: Similarity"
      chapters:
        - file: chapters/Unit_5/index.qmd
        - file: chapters/Unit_5/5.1_Ratios_and_Proportions.qmd
        - file: chapters/Unit_5/5.2_Similar_Figures_and_Scale_Factor.qmd
        - file: chapters/Unit_5/5.3_Similar_Triangles.qmd
        - file: chapters/Unit_5/5.4_Triangle_Proportionality.qmd
        - file: chapters/Unit_5/5.5_Indirect_Measurement.qmd
        - file: chapters/Unit_5/Summary.qmd
        - file: chapters/Unit_5/Review.qmd

    - file: guided-notes.qmd
    - file: glossary.qmd
